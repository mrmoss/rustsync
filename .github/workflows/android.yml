# Builds the Android app (an APK): the Rust core for phones, then the Kotlin app around it.
# Runs on pushes that touch it, and is also called by the release workflow.
#
# The APK is signed with a throw-away key unless you add the repository secrets described in
# the README (ANDROID_KEYSTORE_BASE64 and friends); with a stable key, updates install over the
# old version.
#
# NOTE: written without being able to run it. If a runner image, action or Android tool version
# has moved on, the fix is usually just bumping it here or in android/build.gradle.kts.
name: android

on:
  push:
    paths: ['android/**', 'src/**', 'Cargo.toml', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'Cargo.toml', '.github/workflows/android.yml']
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'

      - name: Rust core for Android (64-bit ARM phones, and x86_64 emulators)
        env:
          # newer phones use 16 KB memory pages
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: cargo ndk --platform 26 -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release --lib --no-default-features

      - name: Signing key (only if the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rustsync.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/rustsync.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=Android signing key missing::This APK is signed with a throw-away key, so the phone will only accept it after uninstalling the old app (which deletes its pairings). Add the four ANDROID_* repository secrets once (README: Android > Signing key) and updates will install over the old version."
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          v=$(grep -m1 '^version' ../Cargo.toml | cut -d'"' -f2)
          gradle assembleRelease --no-daemon -PappVersion="$v"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/rustsync-$v-android.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error
