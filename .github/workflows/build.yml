# Builds and tests rustsync on Linux, macOS and FreeBSD (Intel/AMD and ARM where the runners allow).
# NOTE: written without being able to run it; if a runner image or action version has moved on,
# the fix is usually just bumping it here.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64, Linux aarch64, macOS aarch64 (Apple silicon)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Linux build libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Build (service, command line and window)
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: just
      - name: Debian package (checks the .deb can be made)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          just deb
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Static command-line program (checks it links without libraries)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get install -y musl-tools
          just package-static
      - name: macOS, also for Intel Macs
        if: startsWith(matrix.os, 'macos')
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: '14.5'
          # The service and command line only; the window needs X11/Wayland libraries.
          run: |
            sudo pkg install -y rust
            cargo build --release --no-default-features
            cargo test --release --no-default-features
