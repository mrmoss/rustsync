# Makes a draft GitHub release with downloadable programs when you push a tag like v0.1.0.
#
#   1. bump `version` in Cargo.toml and commit it
#   2. git tag v0.1.0 && git push --tags
#   3. wait for this workflow, look over the draft under "Releases", then publish it
#
# NOTE: written without being able to run it. If a runner image or action version has moved on,
# the fix is usually just bumping it here.
name: release

on:
  push:
    tags: ['v*']

# Read-only by default; only the last job, which creates the release, may write.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 so the programs also run on older Linux systems.
          - { name: linux-x86_64,  runner: ubuntu-22.04 }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, runner: macos-latest }
          - { name: macos-x86_64,  runner: macos-latest, target: x86_64-apple-darwin }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version in Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: just
      - name: Linux build libraries
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Package
        run: just package
      - name: Debian package
        if: startsWith(matrix.runner, 'ubuntu')
        run: just deb
      - name: Static command-line program (Linux)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get install -y musl-tools
          just package-static
      - name: macOS app
        if: startsWith(matrix.runner, 'macos')
        run: just macos-dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error

  freebsd:
    name: freebsd-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version in Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: '14.5'
          # The service and command line only; the window needs X11/Wayland libraries.
          run: |
            sudo pkg install -y rust just
            just package-server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-freebsd-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
    # Only the signing secrets the Android build reads, not every secret in the repository.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    name: draft release
    permissions:
      contents: write
      id-token: write       # to sign the build provenance
      attestations: write
    needs: [build, freebsd, android]
    # Still make the draft if one platform failed, so the others are not lost.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum * > SHA256SUMS
      # A signed statement, kept by GitHub, that these exact files were built by this workflow
      # from this repository (check one with `gh attestation verify FILE --repo OWNER/REPO`).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **This is AI-generated, lightly tested software. Do not make it the only copy of anything you care about.**

          Downloads are for 64-bit Intel/AMD (`x86_64`) and ARM (`aarch64`). Check them against `SHA256SUMS`, or verify where they were built with `gh attestation verify FILE --repo OWNER/REPO`.

          - **Linux:** `rustsync-<version>-linux-<cpu>.tar.gz`, built on Ubuntu 22.04.
            For Debian and Ubuntu (22.04 / Debian 12 or newer) there is also `rustsync_<version>_amd64.deb` (or `arm64`):
            `sudo apt install ./rustsync_<version>_amd64.deb`.
          - **Linux, any distribution:** `rustsync-<version>-linux-<cpu>-static.tar.gz` has just the command-line program, built
            fully static: it needs no libraries, so it runs on any Linux of that CPU (also old systems, Alpine, NAS boxes).
            No window. Names that rely on the system's name-service plugins (like mDNS `.local`) do not resolve in it; use
            an IP address or an ordinary DNS name.
          - **macOS:** `rustsync-<version>-macos-<cpu>.dmg`: open it and drag RustSync into Applications, then open it from there
            (the `.tar.gz` is just the programs). The app is unsigned, so the first time, right-click it and choose Open
            (or allow it in System Settings, Privacy & Security).
          - **FreeBSD:** `rustsync-<version>-freebsd-x86_64.tar.gz` has the service and command line only (no window).
          - **Android:** `rustsync-<version>-android.apk` (64-bit ARM phones). Allow installing from your browser or file manager
            when Android asks. Unless the project has its own signing key set up, a new build can only be installed over an
            older one after uninstalling it first.

          See the README for how to set up and pair your machines.
          NOTES
          # Say so in the draft if a platform did not build.
          missing=""
          for pat in linux-x86_64-static linux-aarch64-static linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64 freebsd-x86_64 android; do
            ls dist/*"$pat"* >/dev/null 2>&1 || missing="$missing $pat"
          done
          if [ -n "$missing" ]; then
            printf '\n> **Not built this time:**%s. See the workflow run.\n' "$missing" >> notes.md
            echo "::warning::missing downloads:$missing"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release for this tag already exists (for example made by hand on the website):
            # add the files to it instead of making a new one.
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes
          fi
