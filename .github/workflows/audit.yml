# Checks the locked dependencies against the RustSec advisory database (known vulnerabilities).
# Runs when dependencies change, and every week, because advisories appear without any commit here.
name: audit

on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '.github/workflows/audit.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit
      - name: Audit
        run: |
          [ -f Cargo.lock ] || cargo generate-lockfile
          # Known vulnerabilities fail the job; so do "unsound" crates (listed exceptions are in
          # .cargo/audit.toml). Unmaintained crates are shown as warnings only.
          cargo audit --deny unsound
