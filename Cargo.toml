[package]
name = "rustsync"
version = "0.8.0"
edition = "2021"
# The service and command line build with this; the window (eframe) needs a recent Rust, 1.95 or newer.
rust-version = "1.81"
license = "GPL-2.0-only"

# The program is a library (the core, also used by the Android app) plus thin command-line and
# window front ends.
[lib]
name = "rustsync"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
# the desktop window (rustsync-gui); servers can skip it with --no-default-features
eframe = { version = "0.37", optional = true, default-features = false, features = [
    # the OpenGL renderer (the default is now wgpu, a much bigger dependency), the Linux windowing
    # systems, copy and paste, links, the built-in fonts, and screen-reader support. If you do not
    # need screen readers, dropping "accesskit" also drops a few D-Bus/XML crates.
    "glow", "x11", "wayland", "clipboard", "links", "default_fonts", "accesskit",
] }
rqrr = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
notify = "6"
# draws pairing codes as QR codes (the terminal and the window)
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# messages between devices and the encrypted backup records
postcard = { version = "1", features = ["use-std"] }
snow = "0.10"
tokio = { version = "1", features = ["full"] }
# the config file (toml_edit changes one setting and keeps the comments)
toml = "0.8"
toml_edit = "0.22"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Reading a QR code with the camera (window only): Linux and macOS.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }

# The Android app calls into the library through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# system tray icon for rustsync-gui: StatusNotifierItem over D-Bus (pure Rust, no GTK). Linux and
# the BSDs (any desktop with a D-Bus session and a tray host).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
ksni = { version = "0.3", features = ["blocking"], optional = true }

# The menu bar icon on macOS (the icon, and the event loop it needs).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.19", default-features = false, optional = true }
winit = { version = "0.30", optional = true }

[features]
default = ["gui", "tray", "camera"]
gui = ["dep:eframe"]
# the tray icon on Linux/BSD, the menu bar icon on macOS
tray = ["dep:ksni", "dep:tray-icon", "dep:winit"]
# scan a pairing QR code with the camera in the window (Linux, macOS). If this does not build
# on your machine, build without it: --no-default-features --features gui,tray
camera = ["gui", "dep:nokhwa", "dep:rqrr"]

[[bin]]
name = "rustsync"
path = "src/main.rs"

[[bin]]
name = "rustsync-gui"
path = "src/gui.rs"
required-features = ["gui"]
